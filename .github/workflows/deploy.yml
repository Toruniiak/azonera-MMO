# GitHub Pages — automatyczny deployment Azonera MMO Website
#
# Po pushu na gałąź `main` workflow buduje pełny eksport statyczny (out/)
# z poprawnym basePath pod https://USERNAME.github.io/REPOSITORY/
# i wdraża go przez GitHub Actions Pages.
#
# WAŻNE:
# - Repozytorium typu https://USERNAME.github.io/ (main repo):
#   ustaw NEXT_PUBLIC_BASE_PATH na "" (puste).
# - Repozytorium typu https://USERNAME.github.io/PROJEKT/ (projektowe):
#   zostaw domyślną konfigurację poniżej.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        env:
          GH_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://toruniiak.github.io/${{ github.event.repository.name }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
